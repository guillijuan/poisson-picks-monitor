name: Check value bets

on:
  # PAUSADO: cupo mensual de OddsPapi agotado (253/250) el 2026-09-03.
  # Se renueva el 22 de cada mes (fecha de alta de la suscripcion). Reactivar
  # el cron cerca del 2026-09-22 -- ver docs/decisions en el repo principal.
  # schedule:
  #   - cron: "0 9 * * *"
  #   - cron: "0 15 * * *"
  #   - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      test_issue:
        description: "Crear un Issue de prueba (para validar notificaciones por correo)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python check_value_bets.py
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_ISSUE: ${{ inputs.test_issue }}

      - name: Guardar log actualizado
        run: |
          git config user.name "poisson-picks-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f value_bets_log.csv ]; then
            git add value_bets_log.csv
            git diff --staged --quiet || git commit -m "Actualiza log de value bets"
            git push
          else
            echo "Sin value bets nuevos, nada que guardar."
          fi
