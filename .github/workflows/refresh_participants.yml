name: Refresh team names

on:
  schedule:
    - cron: "0 5 1 * *"  # 1 vez al mes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python refresh_participants.py
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}

      - name: Guardar cambios
        run: |
          git config user.name "poisson-picks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add participants.json
          git diff --staged --quiet || git commit -m "Refresca nombres de equipos"
          git push
