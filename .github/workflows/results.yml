name: Resolve results (paper trading)

on:
  # PAUSADO junto con check.yml: cupo mensual de OddsPapi agotado el
  # 2026-09-03, se renueva ~22 de cada mes. Los pendientes se resuelven
  # solos apenas se reactive -- no se pierde nada, solo se demora.
  # schedule:
  #   - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python check_results.py
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}

      - name: Guardar log actualizado
        run: |
          git config user.name "poisson-picks-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f value_bets_log.csv ]; then
            git add value_bets_log.csv
            git diff --staged --quiet || git commit -m "Resuelve resultados de value bets (paper trading)"
            git push
          fi
