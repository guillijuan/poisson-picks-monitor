name: Resolve results (paper trading)

on:
  schedule:
    # 1 vez al dia, suficiente margen para que los partidos del dia anterior terminen
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python check_results.py
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}

      - name: Guardar log actualizado
        run: |
          git config user.name "poisson-picks-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f value_bets_log.csv ]; then
            git add value_bets_log.csv
            git diff --staged --quiet || git commit -m "Resuelve resultados de value bets (paper trading)"
            git push
          fi
